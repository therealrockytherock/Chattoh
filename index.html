  o.innerHTML='<div class="cb" style="width:min('+(VW+40)+'px,100%)"><b>Move and zoom</b><canvas id="cv" width="'+VW+'" height="'+VH+'" style="width:'+VW+'px"></canvas><input id="cz" type="range" min="1" max="4" step="0.01" value="1"><div class="ed" style="margin-top:6px">Drag the picture to move it</div><div class="cr"><button id="cx" class="g">Cancel</button><button id="ck">Apply</button></div></div>';
  document.body.appendChild(o);
  const cv=o.querySelector('#cv'),x=cv.getContext('2d'),sl=o.querySelector('#cz'),base=Math.max(VW/im.width,VH/im.height);
  let z=1,px=0,py=0,dr=null;

   px=Math.max(-mx,Math.min(mx,px));py=Math.max(-my,Math.min(my,py));
